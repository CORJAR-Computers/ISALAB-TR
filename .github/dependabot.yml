# ─────────────────────────────────────────────────────────────────────────────
# Dependabot — GitHub Actions + npm
#
# 1) GitHub Actions: un único PR semanal (grupo `all-actions`) en lugar de
#    acumular saltos de major como el paso de checkout@v4 / setup-node@v4 a v7
#    (ver CHANGELOG 0.3.1).
# 2) npm (frontend): PRs semanales separados por tipo de dependencia
#    (runtime vs dev) usando `dependency-type`, que Dependabot distingue
#    gracias al `package-lock.json` trackeado.
#
# Cada PR dispara el CI (frontend + 208 tests Rust + tauri-build), así que
# cualquier actualización queda validada antes de poder mergearse.
# ─────────────────────────────────────────────────────────────────────────────

version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/Bogota"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "ci"
    groups:
      all-actions:
        patterns:
          - "*"
        # Solo menores/parches se agrupan; las majors de actions llegan en
        # PRs individuales (más fáciles de revisar y validar por el CI).
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:30"
      timezone: "America/Bogota"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    groups:
      # Dependencias de producción (lo que empaqueta el frontend).
      runtime:
        dependency-type: "production"
        # Solo menores/parches se agrupan: las majors (p. ej. React 20, zod 5)
        # vienen en PRs individuales y no bloquean a los menores seguros.
        update-types:
          - "minor"
          - "patch"
      # Dependencias de desarrollo (build, test, lint, tipos).
      dev:
        dependency-type: "development"
        # Igual que runtime: majors individuales, menores/parches agrupados.
        update-types:
          - "minor"
          - "patch"
