# ─────────────────────────────────────────────────────────────────────────────
# Dependabot — GitHub Actions
#
# Mantiene las actions de los workflows actualizadas en un único PR semanal
# (grupo `all-actions`), en lugar de esperar a acumular saltos de major como
# ocurrió con el paso de checkout@v4 / setup-node@v4 a v7 (ver CHANGELOG 0.3.1).
#
# Cada PR de Dependabot dispara el CI (jobs frontend + backend + tauri-build),
# así que una actualización de actions queda validada por los 208 tests de Rust
# y el build antes de poder mergearse.
# ─────────────────────────────────────────────────────────────────────────────

version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/Bogota"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "ci"
    groups:
      all-actions:
        patterns:
          - "*"
