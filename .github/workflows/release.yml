name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  # SignPath necesita leer detalles del job y descargar el artefacto.
  actions: read

env:
  CARGO_TERM_COLOR: always
  # Clave privada de firma de actualizaciones (secreto del repo):
  # sin ella `tauri build` no puede generar los artefactos del updater.
  TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
  TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
  # El contexto `secrets` NO está disponible en condiciones `if:` de pasos
  # (invalida el workflow file). Se expone vía env y se compara con
  # `env.SIGNPATH_API_TOKEN` (contexto `env` sí permitido en `if:`). Si el
  # secreto no está configurado, queda vacío y los pasos de firmado se saltan.
  SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}

jobs:
  release:
    name: Build & Release
    # Runner self-hosted (isalab-release-win) en la máquina de desarrollo del
    # mantenedor. GitHub-hosted windows-latest sufrió fallos transitorios de
    # capacidad ("job was not acquired by Runner of type hosted") que dejaron
    # el pipeline de release en cola >1h (v0.3.3). Este job solo se dispara con
    # tags (push de mantenedores), NO con PRs, por lo que el riesgo de
    # seguridad de un runner persistente en un repo público es limitado.
    #
    # ADVERTENCIA: NO usar este runner en jobs disparados por pull_request
    # (ci.yml): cualquier PR podría ejecutar código arbitrario en esta máquina.
    runs-on: [self-hosted, Windows, X64, isalab-release]
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install frontend dependencies
        run: npm ci

      - name: Download Firebird 5 Embedded (bundled runtime)
        shell: pwsh
        run: |
          # El motor embedded está gitignored; se descarga aquí para que el
          # instalador lo incluya vía "resources": ["binaries/firebird/**/*"].
          # El ZIP no tiene carpeta envolvente única: se localiza fbclient.dll
          # (raíz o subcarpeta) y se copia su árbol completo.
          $url = "https://github.com/FirebirdSQL/firebird/releases/download/v5.0.3/Firebird-5.0.3.1683-0-windows-x64.zip"
          $zip = "$env:TEMP\firebird5.zip"
          Invoke-WebRequest -Uri $url -OutFile $zip -UseBasicParsing
          Expand-Archive -Path $zip -DestinationPath "$env:GITHUB_WORKSPACE\firebird5_tmp" -Force
          $dll = Get-ChildItem "$env:GITHUB_WORKSPACE\firebird5_tmp" -Recurse -Filter fbclient.dll | Select-Object -First 1
          if (-not $dll) { throw "fbclient.dll no se encontró en el ZIP de Firebird" }
          $src = Split-Path $dll.FullName -Parent
          $dest = "$env:GITHUB_WORKSPACE\src-tauri\binaries\firebird"
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          Copy-Item "$src\*" -Destination $dest -Recurse -Force
          Remove-Item $zip -Force
          if (-not (Test-Path "$dest\fbclient.dll")) { throw "fbclient.dll no se copió al bundle" }
          Write-Host "fbclient.dll bundled: $(Test-Path "$dest\fbclient.dll")"

      - name: Prune Firebird to embedded subset
        run: node scripts/prune-firebird.mjs

      - name: Build Tauri app
        run: npx tauri build

      # ---- Firmado Authenticode (SignPath Foundation) ----
      # Elimina el aviso SmartScreen en el instalador NSIS. Gratuito para OSS,
      # pero requiere: (1) solicitud/aprobación previa en signpath.io, (2) la
      # instalación del GitHub App de SignPath y (3) una aprobación MANUAL de
      # cada solicitud de firma (por eso el timeout largo).
      #
      # Mientras los secretos SIGNPATH_* no estén configurados, estos pasos se
      # saltan y el release sale sin firmar (igual que hoy).
      #
      # Detalle crítico del updater: la firma Authenticode MODIFICA el .exe e
      # invalida el .sig de minisign que generó `tauri build`; por eso, tras
      # sustituir el instalador por el firmado, se vuelve a firmar con
      # minisign y `latest.json` se genera después (lee el .sig nuevo).
      - name: Upload unsigned installer (SignPath)
        id: upload-unsigned
        if: ${{ env.SIGNPATH_API_TOKEN != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: isalab-unsigned-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 1

      - name: Submit signing request (SignPath)
        if: ${{ env.SIGNPATH_API_TOKEN != '' }}
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ secrets.SIGNPATH_ORG_ID }}
          project-slug: ${{ secrets.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ secrets.SIGNPATH_SIGNING_POLICY_SLUG }}
          # El instalador se sube en ZIP (comportamiento por defecto de
          # upload-artifact): la Artifact Configuration de SignPath debe tener
          # raíz <zip-file>.
          github-artifact-id: ${{ steps.upload-unsigned.outputs.artifact-id }}
          # Si la Artifact Configuration define parámetros de usuario (por
          # ejemplo `version`, que SignPath suele exigir por su validación de
          # metadatos estrictos), se pasan aquí. Se toma del tag del release
          # (v0.3.2 → 0.3.2) y se serializa como string con toJSON para que el
          # parser YAML no lo convierta a número.
          parameters: |
            version: ${{ toJSON(github.ref_name) }}
          wait-for-completion: true
          # La aprobación manual del aprobador puede tardar más de 10 min.
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: './signed'

      - name: Replace installer with signed build and re-sign updater (minisign)
        if: ${{ env.SIGNPATH_API_TOKEN != '' }}
        shell: pwsh
        run: |
          $signed = Get-ChildItem './signed' -Recurse -Filter '*.exe' | Select-Object -First 1
          if (-not $signed) { throw 'No se encontró el instalador firmado por SignPath' }
          Copy-Item $signed.FullName -Destination 'src-tauri/target/release/bundle/nsis/' -Force
          $exePath = (Get-ChildItem 'src-tauri/target/release/bundle/nsis/*.exe' | Select-Object -First 1).FullName
          # El .sig de `tauri build` cubre el instalador SIN firmar; al sustituir
          # el binario queda obsoleto. Se elimina antes de re-firmar para que el
          # control posterior sea significativo (si no, un fallo silencioso del
          # signer pasaría el Test-Path con el .sig antiguo y latest.json
          # llevaría una firma inválida).
          Remove-Item "$exePath.sig" -ErrorAction SilentlyContinue
          Write-Host "Re-firmando con minisign: $exePath"
          # La clave privada viene del env del workflow (TAURI_SIGNING_PRIVATE_KEY).
          npx tauri signer sign -p "$env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD" "$exePath"
          if ($LASTEXITCODE -ne 0) { throw "Fallo al re-firmar con minisign (exit $LASTEXITCODE)" }
          if (-not (Test-Path "$exePath.sig")) { throw 'Firma minisign no generada' }

      # `tauri build` genera el instalador y su firma .sig, pero NO el
      # manifiesto latest.json que el auto-updater consulta en el endpoint
      # .../releases/latest/download/latest.json. Se genera aquí.
      - name: Generate updater manifest (latest.json)
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $exe = "ISALAB_${version}_x64-setup.exe"
          $sigPath = "src-tauri/target/release/bundle/nsis/${exe}.sig"
          if (-not (Test-Path $sigPath)) { throw "Firma del instalador no encontrada: $sigPath" }
          $signature = (Get-Content $sigPath -Raw).Trim()
          $url = "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/${exe}"
          $manifest = [ordered]@{
            version   = $version
            notes     = "ISALAB v${version}"
            pub_date  = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ss.fffZ")
            platforms = [ordered]@{
              "windows-x86_64" = [ordered]@{
                signature = $signature
                url       = $url
              }
            }
          }
          $manifest | ConvertTo-Json -Depth 5 | Set-Content -Path "src-tauri/target/release/bundle/nsis/latest.json" -Encoding UTF8
          Write-Host "latest.json generado para v${version}: $url"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          # Incluye instalador NSIS, firma .sig y el manifiesto latest.json
          # del auto-updater (endpoint: .../releases/latest/download/latest.json).
          files: |
            src-tauri/target/release/bundle/**/*
          draft: true
          generate_release_notes: true

      # El endpoint del updater apunta a "latest": si el release queda en
      # borrador, los clientes no reciben la actualización hasta publicarlo.
      # Publica el borrador (botón "Publish release") cuando quieras
      # distribuirlo.
