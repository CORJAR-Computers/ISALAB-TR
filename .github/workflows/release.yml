name: Release

on:
  push:
    tags:
      - 'v*'
  # Fallback de emergencia: publica el tag indicado cross-compilando desde
  # ubuntu-latest cuando la máquina del runner self-hosted está apagada.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag a publicar (ej. v0.3.4). Debe existir en el repo.'
        required: true
        type: string

permissions:
  contents: write
  # SignPath necesita leer detalles del job y descargar el artefacto.
  actions: read

env:
  CARGO_TERM_COLOR: always
  # Clave privada de firma de actualizaciones (secreto del repo):
  # sin ella `tauri build` no puede generar los artefactos del updater.
  TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
  TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
  # El contexto `secrets` NO está disponible en condiciones `if:` de pasos
  # (invalida el workflow file). Se expone vía env y se compara con
  # `env.SIGNPATH_API_TOKEN` (contexto `env` sí permitido en `if:`). Si el
  # secreto no está configurado, queda vacío y los pasos de firmado se saltan.
  SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}

jobs:
  # Decide el runner del job de release según si SignPath está activo.
  # `runs-on` no puede leer los contextos `secrets`/`env` directamente, así
  # que un job previo en GitHub-hosted (ubuntu-latest, barato) lee el secreto
  # (vía el env del workflow) y expone la etiqueta del runner elegido.
  #
  # Por qué importa: el programa OSS de SignPath exige que TODOS los jobs del
  # workflow que llevan a la solicitud de firma corran en runners
  # GitHub-hosted. Sin SignPath seguimos en el runner self-hosted (evita los
  # fallos transitorios de capacidad de windows-latest que dejaron el release
  # en cola >1h en v0.3.3); con SignPath activo pasamos a windows-latest.
  decide-runner:
    # Acoplamiento intencionado: este `if` debe ser un espejo del del job
    # `release` (que le hace `needs`). Si release pasara a dispararse por otro
    # evento y este job se saltara, release se saltaría también (propagación
    # de skip de los jobs `needs`).
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    # Defensivo: un job de ubuntu atascado no debe bloquear el release.
    timeout-minutes: 10
    outputs:
      runner: ${{ steps.decide.outputs.runner }}
    steps:
      - id: decide
        shell: bash
        run: |
          if [[ -n "$SIGNPATH_API_TOKEN" ]]; then
            # JSON válido para que `fromJSON` lo convierta al string "windows-latest".
            echo 'runner="windows-latest"' >> "$GITHUB_OUTPUT"
          else
            echo 'runner=["self-hosted","Windows","X64","isalab-release"]' >> "$GITHUB_OUTPUT"
          fi

  release:
    name: Build & Release
    # Solo el push de tags dispara el build nativo; el fallback se ejecuta con
    # workflow_dispatch y no debe duplicar el release.
    if: github.event_name == 'push'
    needs: decide-runner
    # Runner elegido por `decide-runner`:
    # - sin SignPath: self-hosted (isalab-release-win), máquina del mantenedor.
    #   GitHub-hosted windows-latest sufrió fallos transitorios de capacidad
    #   ("job was not acquired by Runner of type hosted") que dejaron el
    #   pipeline en cola >1h (v0.3.3). Este job solo se dispara con tags (push
    #   de mantenedores), NO con PRs, por lo que el riesgo de seguridad de un
    #   runner persistente en un repo público es limitado.
    # - con SignPath: windows-latest (requisito OSS de GitHub-hosted).
    #
    # ADVERTENCIA: NO usar el runner self-hosted en jobs disparados por
    # pull_request (ci.yml): cualquier PR podría ejecutar código arbitrario en
    # esa máquina.
    runs-on: ${{ fromJSON(needs.decide-runner.outputs.runner) }}
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install frontend dependencies
        run: npm ci

      - name: Download Firebird 5 Embedded (bundled runtime)
        shell: pwsh
        run: |
          # El motor embedded está gitignored; se descarga aquí para que el
          # instalador lo incluya vía "resources": ["binaries/firebird/**/*"].
          # El ZIP no tiene carpeta envolvente única: se localiza fbclient.dll
          # (raíz o subcarpeta) y se copia su árbol completo.
          $url = "https://github.com/FirebirdSQL/firebird/releases/download/v5.0.3/Firebird-5.0.3.1683-0-windows-x64.zip"
          $zip = "$env:TEMP\firebird5.zip"
          Invoke-WebRequest -Uri $url -OutFile $zip -UseBasicParsing
          Expand-Archive -Path $zip -DestinationPath "$env:GITHUB_WORKSPACE\firebird5_tmp" -Force
          $dll = Get-ChildItem "$env:GITHUB_WORKSPACE\firebird5_tmp" -Recurse -Filter fbclient.dll | Select-Object -First 1
          if (-not $dll) { throw "fbclient.dll no se encontró en el ZIP de Firebird" }
          $src = Split-Path $dll.FullName -Parent
          $dest = "$env:GITHUB_WORKSPACE\src-tauri\binaries\firebird"
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          Copy-Item "$src\*" -Destination $dest -Recurse -Force
          Remove-Item $zip -Force
          if (-not (Test-Path "$dest\fbclient.dll")) { throw "fbclient.dll no se copió al bundle" }
          Write-Host "fbclient.dll bundled: $(Test-Path "$dest\fbclient.dll")"

      - name: Prune Firebird to embedded subset
        run: node scripts/prune-firebird.mjs

      - name: Build Tauri app
        run: npx tauri build

      # ---- Firmado Authenticode (SignPath Foundation) ----
      # Elimina el aviso SmartScreen en el instalador NSIS. Gratuito para OSS,
      # pero requiere: (1) solicitud/aprobación previa en signpath.io, (2) la
      # instalación del GitHub App de SignPath y (3) una aprobación MANUAL de
      # cada solicitud de firma (por eso el timeout largo).
      #
      # Mientras los secretos SIGNPATH_* no estén configurados, estos pasos se
      # saltan y el release sale sin firmar (igual que hoy).
      #
      # Detalle crítico del updater: la firma Authenticode MODIFICA el .exe e
      # invalida el .sig de minisign que generó `tauri build`; por eso, tras
      # sustituir el instalador por el firmado, se vuelve a firmar con
      # minisign y `latest.json` se genera después (lee el .sig nuevo).
      - name: Upload unsigned installer (SignPath)
        id: upload-unsigned
        if: ${{ env.SIGNPATH_API_TOKEN != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: isalab-unsigned-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 1

      - name: Submit signing request (SignPath)
        if: ${{ env.SIGNPATH_API_TOKEN != '' }}
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ secrets.SIGNPATH_ORG_ID }}
          project-slug: ${{ secrets.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ secrets.SIGNPATH_SIGNING_POLICY_SLUG }}
          # El instalador se sube en ZIP (comportamiento por defecto de
          # upload-artifact): la Artifact Configuration de SignPath debe tener
          # raíz <zip-file>.
          github-artifact-id: ${{ steps.upload-unsigned.outputs.artifact-id }}
          # Si la Artifact Configuration define parámetros de usuario (por
          # ejemplo `version`, que SignPath suele exigir por su validación de
          # metadatos estrictos), se pasan aquí. Se toma del tag del release
          # (v0.3.2 → 0.3.2) y se serializa como string con toJSON para que el
          # parser YAML no lo convierta a número.
          parameters: |
            version: ${{ toJSON(github.ref_name) }}
          wait-for-completion: true
          # La aprobación manual del aprobador puede tardar más de 10 min.
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: './signed'

      - name: Replace installer with signed build and re-sign updater (minisign)
        if: ${{ env.SIGNPATH_API_TOKEN != '' }}
        shell: pwsh
        run: |
          $signed = Get-ChildItem './signed' -Recurse -Filter '*.exe' | Select-Object -First 1
          if (-not $signed) { throw 'No se encontró el instalador firmado por SignPath' }
          Copy-Item $signed.FullName -Destination 'src-tauri/target/release/bundle/nsis/' -Force
          $exePath = (Get-ChildItem 'src-tauri/target/release/bundle/nsis/*.exe' | Select-Object -First 1).FullName
          # El .sig de `tauri build` cubre el instalador SIN firmar; al sustituir
          # el binario queda obsoleto. Se elimina antes de re-firmar para que el
          # control posterior sea significativo (si no, un fallo silencioso del
          # signer pasaría el Test-Path con el .sig antiguo y latest.json
          # llevaría una firma inválida).
          Remove-Item "$exePath.sig" -ErrorAction SilentlyContinue
          Write-Host "Re-firmando con minisign: $exePath"
          # La clave privada viene del env del workflow (TAURI_SIGNING_PRIVATE_KEY).
          npx tauri signer sign -p "$env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD" "$exePath"
          if ($LASTEXITCODE -ne 0) { throw "Fallo al re-firmar con minisign (exit $LASTEXITCODE)" }
          if (-not (Test-Path "$exePath.sig")) { throw 'Firma minisign no generada' }

      # `tauri build` genera el instalador y su firma .sig, pero NO el
      # manifiesto latest.json que el auto-updater consulta en el endpoint
      # .../releases/latest/download/latest.json. Se genera aquí.
      - name: Generate updater manifest (latest.json)
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $exe = "ISALAB_${version}_x64-setup.exe"
          $sigPath = "src-tauri/target/release/bundle/nsis/${exe}.sig"
          if (-not (Test-Path $sigPath)) { throw "Firma del instalador no encontrada: $sigPath" }
          $signature = (Get-Content $sigPath -Raw).Trim()
          $url = "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/${exe}"
          $manifest = [ordered]@{
            version   = $version
            notes     = "ISALAB v${version}"
            pub_date  = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ss.fffZ")
            platforms = [ordered]@{
              "windows-x86_64" = [ordered]@{
                signature = $signature
                url       = $url
              }
            }
          }
          $manifest | ConvertTo-Json -Depth 5 | Set-Content -Path "src-tauri/target/release/bundle/nsis/latest.json" -Encoding UTF8
          Write-Host "latest.json generado para v${version}: $url"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          # Incluye instalador NSIS, firma .sig y el manifiesto latest.json
          # del auto-updater (endpoint: .../releases/latest/download/latest.json).
          files: |
            src-tauri/target/release/bundle/**/*
          draft: true
          generate_release_notes: true

      # El endpoint del updater apunta a "latest": si el release queda en
      # borrador, los clientes no reciben la actualización hasta publicarlo.
      # Publica el borrador (botón "Publish release") cuando quieras
      # distribuirlo.

  # ---- Fallback de emergencia: cross-compile Windows x64 desde Linux ----
  # Se dispara MANUALMENTE (workflow_dispatch, input `tag`) cuando la máquina
  # del runner self-hosted está apagada y hay que publicar una release.
  # Cross-compila el instalador NSIS con cargo-xwin (CRT/MSVC vía xwin) +
  # makensis, y genera los artefactos del updater (.sig + latest.json).
  #
  # Limitaciones frente al job principal:
  # - No firma con SignPath (ese paso usa pwsh en el runner Windows). El
  #   instalador del fallback sale sin Authenticode; el auto-updater igual
  #   funciona (usa la firma minisign .sig, que sí se genera).
  # - Cross-compile: los -sys de C (ring, openssl, zstd) requieren clang + lld
  #   que cargo-xwin instala/usa automáticamente.
  release-fallback:
    name: Build & Release (fallback cross-compile)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      # El config.toml local fija un target-dir de Windows; se fuerza uno
      # ABSOLUTO bajo el workspace (el CLI de Tauri invoca cargo con cwd en
      # src-tauri, y una ruta relativa resolvería en src-tauri/src-tauri/target,
      # rompiendo el cache y el glob de assets del release).
      CARGO_TARGET_DIR: ${{ github.workspace }}/src-tauri/target
      # Wrapper linker que instala cargo-xwin: enlaza contra el CRT/SDK de
      # Microsoft descargado por xwin (target MSVC).
      CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER: xwin-cargo
      # ring (vía cc-rs) busca el archiver MSVC lib.exe, que xwin NO provee
      # (solo descarga CRT/SDK). llvm-lib emula lib.exe; sin esto el build
      # falla en ring: 'failed to find tool "lib.exe"'.
      CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_AR: llvm-lib
      # ring compila C con cc-rs: clang-cl es el compilador MSVC-compatible
      # que ya viene en ubuntu-latest (o se instala con el paquete clang).
      CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_CC: clang-cl
    steps:
      - uses: actions/checkout@v7
        with:
          # El workflow_dispatch corre desde master; el input `tag` indica qué
          # tag publicar (debe existir en el repo).
          ref: ${{ inputs.tag }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'

      - name: Install Rust (target Windows MSVC)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install cargo-xwin
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-xwin

      - name: Install NSIS + system deps
        # makensis genera el instalador NSIS; las libs WebKit/GTK las instalan
        # los templates oficiales de Tauri en ubuntu (el CLI puede verificar
        # deps de sistema aunque el target sea Windows; inofensivas si no se
        # usan).
        # clang/lld/llvm: el archiver llvm-lib y el linker lld que xwin-cargo
        # necesita para el target MSVC (ring usa cc-rs, que requiere lib.exe
        # emulado por llvm-lib).
        run: |
          sudo apt-get update
          sudo apt-get install -y nsis libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev clang lld llvm
          # llvm-lib se instala como llvm-lib-XX; exponerlo sin versión para
          # que CARGO_TARGET_..._AR=llvm-lib lo encuentre.
          if ! command -v llvm-lib >/dev/null 2>&1; then
            lib=$(ls /usr/bin/llvm-lib-* 2>/dev/null | head -1)
            [ -n "$lib" ] && sudo ln -sf "$lib" /usr/local/bin/llvm-lib
          fi
          command -v llvm-lib && command -v clang-cl && echo "toolchain MSVC OK"

      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install frontend dependencies
        run: npm ci

      - name: Download Firebird 5 Embedded (bundled runtime)
        shell: bash
        run: |
          url="https://github.com/FirebirdSQL/firebird/releases/download/v5.0.3/Firebird-5.0.3.1683-0-windows-x64.zip"
          zip="/tmp/firebird5.zip"
          curl -sSL -o "$zip" "$url"
          unzip -q "$zip" -d "$GITHUB_WORKSPACE/firebird5_tmp"
          dll=$(find "$GITHUB_WORKSPACE/firebird5_tmp" -name fbclient.dll | head -1)
          if [ -z "$dll" ]; then echo "fbclient.dll no encontrado en el ZIP" >&2; exit 1; fi
          src=$(dirname "$dll")
          dest="$GITHUB_WORKSPACE/src-tauri/binaries/firebird"
          mkdir -p "$dest"
          cp -r "$src"/* "$dest"/
          rm -f "$zip"
          test -f "$dest/fbclient.dll" && echo "fbclient.dll bundled: true" || { echo "fbclient.dll no se copió al bundle" >&2; exit 1; }

      - name: Prune Firebird to embedded subset
        run: node scripts/prune-firebird.mjs

      - name: Build Tauri app (cross-compile Windows x64)
        run: npx tauri build --target x86_64-pc-windows-msvc --bundles nsis

      # `tauri build` genera el instalador y su .sig (updater), pero NO el
      # manifiesto latest.json; se genera aquí en bash (el fallback no tiene
      # pwsh).
      - name: Generate updater manifest (latest.json)
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          exe="ISALAB_${version}_x64-setup.exe"
          bundle="src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis"
          sig_path="$bundle/${exe}.sig"
          if [ ! -f "$sig_path" ]; then echo "Firma del instalador no encontrada: $sig_path" >&2; exit 1; fi
          signature=$(tr -d '\r\n' < "$sig_path")
          url="https://github.com/${{ github.repository }}/releases/download/${{ inputs.tag }}/${exe}"
          pub_date=$(date -u +%Y-%m-%dT%H:%M:%S.000Z)
          node -e '
            const fs = require("fs");
            const [version, pubDate, signature, url, out] = process.argv.slice(1);
            const manifest = {
              version,
              notes: `ISALAB v${version}`,
              pub_date: pubDate,
              platforms: {
                "windows-x86_64": { signature, url },
              },
            };
            fs.writeFileSync(out, JSON.stringify(manifest, null, 2) + "\n");
          ' "$version" "$pub_date" "$signature" "$url" "$bundle/latest.json"
          echo "latest.json generado para v${version}: $url"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          # Si el job principal ya creó el draft para este tag (runner
          # encendido a medias), no fallar: sube los assets del fallback.
          skipIfReleaseExists: true
          tag_name: ${{ inputs.tag }}
          files: |
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/**/*
          draft: true
          generate_release_notes: true
