name: CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

# Los jobs de CI solo suben artefactos (upload-artifact), no escriben en el
# repo. Mínimo privilegio: lectura. (release.yml declara su propio permiso de
# escritura cuando necesita publicar el release.)
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

# Los pasos que tocan la red externa (npm ci, descarga de Firebird,
# instalación de Playwright, cargo fetch) van envueltos en nick-fields/retry:
# fallos transitorios de mirrors/CDN (p. ej. "Hash Sum mismatch" de apt en
# CI #113) no deben tumbar el build. Cada intento tiene timeout propio.

jobs:
  frontend:
    name: Frontend (React)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'
      - name: Install dependencies
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 10
          max_attempts: 3
          command: npm ci
      # Guarda de bindings: verifica que cada comando registrado en
      # collect_commands! (lib.rs) exista en src/bindings.ts y viceversa.
      # Falla si se cambió Rust sin regenerar los bindings (históricamente
      # el drift pasó desapercibido porque la UI aún no invocaba los
      # comandos nuevos).
      - name: Check bindings.ts is up to date
        run: npm run check:bindings
      - name: Run ESLint
        run: npm run lint
      - name: Run Vitest
        run: npm run test
      - name: Build Frontend
        run: npm run build

  backend:
    name: Backend (Rust)
    runs-on: windows-latest
    env:
      FIREBIRD_VERSION: "5.0.3.1683-0"
      FIREBIRD_DIR: ${{ github.workspace }}\firebird5
    steps:
      - uses: actions/checkout@v7

      - name: Cache Firebird 5 runtime
        id: cache-firebird
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}\firebird5
          key: firebird-5.0.3.1683-windows-x64

      - name: Download Firebird 5 Embedded (if not cached)
        if: steps.cache-firebird.outputs.cache-hit != 'true'
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 10
          max_attempts: 3
          shell: pwsh
          command: |
            $url = "https://github.com/FirebirdSQL/firebird/releases/download/v5.0.3/Firebird-5.0.3.1683-0-windows-x64.zip"
            $zip = "$env:TEMP\firebird5.zip"
            Write-Host "Downloading Firebird 5 from $url ..."
            Invoke-WebRequest -Uri $url -OutFile $zip -UseBasicParsing
            Expand-Archive -Path $zip -DestinationPath "$env:GITHUB_WORKSPACE\firebird5_tmp" -Force
            # El ZIP no tiene carpeta envolvente única: se localiza fbclient.dll
            # (raíz o subcarpeta) y se copia su árbol completo a FIREBIRD_DIR.
            $dll = Get-ChildItem "$env:GITHUB_WORKSPACE\firebird5_tmp" -Recurse -Filter fbclient.dll | Select-Object -First 1
            if (-not $dll) { throw "fbclient.dll no se encontró en el ZIP de Firebird" }
            $src = Split-Path $dll.FullName -Parent
            New-Item -ItemType Directory -Force -Path "$env:GITHUB_WORKSPACE\firebird5" | Out-Null
            Copy-Item "$src\*" -Destination "$env:GITHUB_WORKSPACE\firebird5" -Recurse -Force
            Remove-Item "$env:GITHUB_WORKSPACE\firebird5_tmp" -Recurse -Force -ErrorAction SilentlyContinue
            Remove-Item $zip -Force
            Write-Host "fbclient.dll: $(Test-Path "$env:GITHUB_WORKSPACE\firebird5\fbclient.dll")"

      - name: Add Firebird to PATH
        shell: pwsh
        run: |
          echo "$env:FIREBIRD_DIR" >> $env:GITHUB_PATH
          echo "FIREBIRD_DIR=$env:FIREBIRD_DIR" >> $env:GITHUB_ENV
          Write-Host "FIREBIRD_DIR=$env:FIREBIRD_DIR"
          Write-Host "fbclient.dll exists: $(Test-Path "$env:FIREBIRD_DIR\fbclient.dll")"

      # Los tests corren contra el mismo subconjunto embedded que se empaqueta
      # (sin tools de servidor ni docs): si el prune rompiera algo, falla aquí.
      - name: Prune Firebird to embedded subset
        run: node scripts/prune-firebird.mjs firebird5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      # Descarga los crates exactos del lockfile para que fmt/clippy/test
      # corran sin red. Con cache caliente es un no-op; con cache frío o
      # parcial rellena huecos con retry.
      - name: Fetch cargo dependencies (locked, with retry)
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 15
          max_attempts: 3
          command: cargo fetch --locked --manifest-path src-tauri/Cargo.toml

      - name: Check format
        run: cargo fmt --all -- --check
        working-directory: ./src-tauri
      - name: Run clippy
        run: cargo clippy -- -D warnings
        working-directory: ./src-tauri
      - name: Run tests
        run: cargo test
        working-directory: ./src-tauri
      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - name: Audit Rust dependencies (RustSec)
        working-directory: ./src-tauri
        run: |
          # RUSTSEC-2026-0187 (lopdf 0.36, vía pdf_signer) y RUSTSEC-2023-0071
          # (rsa 0.9, Marvin Attack) no tienen fix disponible y están
          # documentadas en CHANGELOG. Se ignoran explícitamente para que este
          # paso falle solo cuando aparezca una vulnerabilidad NUEVA.
          cargo audit --ignore RUSTSEC-2026-0187 --ignore RUSTSEC-2023-0071

  e2e:
    name: E2E Smoke (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'
      - name: Install dependencies
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 10
          max_attempts: 3
          command: npm ci
      - name: Remove unused Google Chrome apt source
        # El mirror de Chrome (preinstalado en la imagen) publica índices
        # continuamente y provoca "Hash Sum mismatch" intermitente en
        # apt-get update; no lo usamos, así que lo quitamos.
        run: sudo rm -f /etc/apt/sources.list.d/google-chrome.list
      - name: Install Playwright browsers and OS deps
        # Reintento a nivel de bloque: si apt falla en un intento (índices
        # que cambian a mitad del fetch), el siguiente re-descarga índices
        # frescos y sigue. `playwright install` (navegador) no toca apt.
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 15
          max_attempts: 3
          retry_wait_seconds: 15
          command: |
            sudo apt-get update
            npx playwright install-deps chromium
            npx playwright install chromium
      - name: Run E2E smoke tests
        # La UI corre en el dev server de Vite con el IPC de Tauri mockeado
        # (e2e/ipc-mock.script.js): valida login, dashboard y el flujo
        # completo de una muestra sin necesitar el backend Rust.
        run: npm run test:e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  tauri-build:
    name: Tauri Build
    needs: [frontend, backend]
    runs-on: windows-latest
    env:
      # createUpdaterArtifacts está activo: sin la clave de firma el build falla.
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - name: Fetch cargo dependencies (locked, with retry)
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 15
          max_attempts: 3
          command: cargo fetch --locked --manifest-path src-tauri/Cargo.toml
      - name: Install frontend dependencies
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 10
          max_attempts: 3
          command: npm ci
      - name: Download Firebird 5 Embedded (bundled runtime)
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 10
          max_attempts: 3
          shell: pwsh
          command: |
            # El motor embedded está gitignored; se descarga aquí para que el
            # instalador lo incluya vía "resources": ["binaries/firebird/**/*"].
            # El ZIP no tiene carpeta envolvente única: se localiza fbclient.dll
            # (raíz o subcarpeta) y se copia su árbol completo.
            $url = "https://github.com/FirebirdSQL/firebird/releases/download/v5.0.3/Firebird-5.0.3.1683-0-windows-x64.zip"
            $zip = "$env:TEMP\firebird5.zip"
            Invoke-WebRequest -Uri $url -OutFile $zip -UseBasicParsing
            Expand-Archive -Path $zip -DestinationPath "$env:GITHUB_WORKSPACE\firebird5_tmp" -Force
            $dll = Get-ChildItem "$env:GITHUB_WORKSPACE\firebird5_tmp" -Recurse -Filter fbclient.dll | Select-Object -First 1
            if (-not $dll) { throw "fbclient.dll no se encontró en el ZIP de Firebird" }
            $src = Split-Path $dll.FullName -Parent
            $dest = "$env:GITHUB_WORKSPACE\src-tauri\binaries\firebird"
            New-Item -ItemType Directory -Force -Path $dest | Out-Null
            Copy-Item "$src\*" -Destination $dest -Recurse -Force
            Remove-Item $zip -Force
            if (-not (Test-Path "$dest\fbclient.dll")) { throw "fbclient.dll no se copió al bundle" }
            Write-Host "fbclient.dll bundled: $(Test-Path "$dest\fbclient.dll")"
      - name: Prune Firebird to embedded subset
        run: node scripts/prune-firebird.mjs
      - name: Build Tauri app
        shell: pwsh
        run: |
          # En Pull Requests (como los de Dependabot o forks), los secrets de firma
          # del repo no están disponibles por seguridad de GitHub Actions. Si la clave
          # está ausente o vacía, se eliminan las variables vacías del entorno y se
          # desactiva temporalmente createUpdaterArtifacts en tauri.conf.json para que
          # el empaquetado NSIS se construya y valide sin requerir firma de release.
          if (-not $env:TAURI_SIGNING_PRIVATE_KEY -or $env:TAURI_SIGNING_PRIVATE_KEY.Trim() -eq "") {
            Write-Host "TAURI_SIGNING_PRIVATE_KEY no disponible; desactivando temporalmente firma de updater para CI..."
            Remove-Item Env:TAURI_SIGNING_PRIVATE_KEY -ErrorAction SilentlyContinue
            Remove-Item Env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD -ErrorAction SilentlyContinue
            $cfgPath = "src-tauri/tauri.conf.json"
            $cfg = Get-Content $cfgPath -Raw | ConvertFrom-Json
            $cfg.bundle.createUpdaterArtifacts = $false
            $cfg | ConvertTo-Json -Depth 10 | Set-Content $cfgPath -Encoding UTF8
          }
          npx tauri build
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: isalab-windows
          path: |
            src-tauri/target/release/bundle/**/*.exe
          retention-days: 30
