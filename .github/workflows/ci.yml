name: CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

# Un push nuevo a la misma rama/PR cancela el run anterior en curso.
# Motivo: el runner no tenía techo propio y un run colgado (CI #114 del
# backend, >1 h dentro de "Run tests" sobre un test que se quedó esperando
# la conexión de Firebird) mantuvo la ventana ocupada hasta el límite de 6 h.
# Con grupos por ref, además, solo el último commit de una rama consume
# runners: los pushes intermedios ya no compiten entre sí.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Los jobs de CI solo suben artefactos (upload-artifact), no escriben en el
# repo. Mínimo privilegio: lectura. (release.yml declara su propio permiso de
# escritura cuando necesita publicar el release.)
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

# Los pasos que tocan la red externa (npm ci, descarga de Firebird,
# instalación de Playwright, cargo fetch) van envueltos en nick-fields/retry:
# fallos transitorios de mirrors/CDN (p. ej. "Hash Sum mismatch" de apt en
# CI #113) no deben tumbar el build. Cada intento tiene timeout propio.

# Presupuesto de tiempo por job (`timeout-minutes`). Son techos de seguridad,
# no estimaciones de duración: cada uno está muy por encima del tiempo normal
# medido, pero acotado por debajo de la ventana de 6 h del runner. Un job que
# los supere se cancela con fallo explícito en vez de quedarse colgado.

jobs:
  frontend:
    name: Frontend (React)
    runs-on: ubuntu-latest
    # Normal: ~1-2 min (CI #115: 52 s). Techo holgado para cache fría de npm
    # y los 3 intentos de `npm ci` (10 min cada uno).
    timeout-minutes: 20
    env:
      # La clínica opera en hora de Colombia (UTC-5) y los runners corren en UTC.
      # Con TZ=UTC un uso accidental de toISOString() para fechas "de hoy" en
      # Vitest pasaría siempre, y el bug solo aparecería a las 19:00 en la
      # clínica. Fijando la zona aquí, la suite corre en la zona del usuario.
      TZ: America/Bogota
    steps:
      - uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'
      - name: Install dependencies
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 10
          max_attempts: 3
          command: npm ci
      # Guarda de bindings: verifica que cada comando registrado en
      # collect_commands! (lib.rs) exista en src/bindings.ts y viceversa.
      # Falla si se cambió Rust sin regenerar los bindings (históricamente
      # el drift pasó desapercibido porque la UI aún no invocaba los
      # comandos nuevos).
      - name: Check bindings.ts is up to date
        run: npm run check:bindings
      # Esquema por comando (campos de respuesta y claves del payload) generado
      # desde bindings.ts y cruzado con los tipos de Rust: un campo renombrado
      # en Rust o en el mock falla aquí, no en la clínica.
      - name: Check IPC command shapes
        run: npm run check:ipc-shapes
      # `lint` cubre src/ y e2e/ (incluye las reglas de eslint-plugin-playwright).
      - name: Run ESLint
        run: npm run lint
      # Cobertura con umbrales (vitest.config.ts): mide los módulos con red
      # hoy (reglas de dinero y helpers compartidos). Baja el umbral solo con
      # un cambio explícito, no por dejar de probar algo.
      - name: Run Vitest with coverage thresholds
        run: npm run test:coverage
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-summary
          path: coverage/
          retention-days: 7
      - name: Build Frontend
        run: npm run build

  backend:
    name: Backend (Rust)
    runs-on: windows-latest
    # Normal: 17-18 min (CI #115: 17 min 51 s, de los cuales 2 min 16 s son
    # tests). El techo deja margen para cache fría de cargo (compilar deps en
    # Windows) y para los reintentos de `cargo fetch` (15 min cada uno).
    # El run colgado llegó a 1 h sin terminar: aquí muere a los 50 min.
    timeout-minutes: 50
    # La clínica opera en hora de Colombia (UTC-5). Varios tests de reportes y
    # fechas calculan "hoy" desde la hora del sistema, así que sin esta variable
    # los asserts del runner UTC (9999-12-31T23:59:59Z / 00:00Z) no reproducen
    # lo que la app ve en la clínica y, al rotar runner o horario de mantenimiento,
    # algunos tests volverían a fallar solo por la zona.
    env:
      TZ: America/Bogota
      FIREBIRD_VERSION: "5.0.3.1683-0"
      FIREBIRD_DIR: ${{ github.workspace }}\firebird5
    steps:
      - uses: actions/checkout@v7

      - name: Cache Firebird 5 runtime
        id: cache-firebird
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}\firebird5
          key: firebird-5.0.3.1683-windows-x64

      - name: Download Firebird 5 Embedded (if not cached)
        if: steps.cache-firebird.outputs.cache-hit != 'true'
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 10
          max_attempts: 3
          shell: pwsh
          command: |
            $url = "https://github.com/FirebirdSQL/firebird/releases/download/v5.0.3/Firebird-5.0.3.1683-0-windows-x64.zip"
            $zip = "$env:TEMP\firebird5.zip"
            Write-Host "Downloading Firebird 5 from $url ..."
            Invoke-WebRequest -Uri $url -OutFile $zip -UseBasicParsing
            Expand-Archive -Path $zip -DestinationPath "$env:GITHUB_WORKSPACE\firebird5_tmp" -Force
            # El ZIP no tiene carpeta envolvente única: se localiza fbclient.dll
            # (raíz o subcarpeta) y se copia su árbol completo a FIREBIRD_DIR.
            $dll = Get-ChildItem "$env:GITHUB_WORKSPACE\firebird5_tmp" -Recurse -Filter fbclient.dll | Select-Object -First 1
            if (-not $dll) { throw "fbclient.dll no se encontró en el ZIP de Firebird" }
            $src = Split-Path $dll.FullName -Parent
            New-Item -ItemType Directory -Force -Path "$env:GITHUB_WORKSPACE\firebird5" | Out-Null
            Copy-Item "$src\*" -Destination "$env:GITHUB_WORKSPACE\firebird5" -Recurse -Force
            Remove-Item "$env:GITHUB_WORKSPACE\firebird5_tmp" -Recurse -Force -ErrorAction SilentlyContinue
            Remove-Item $zip -Force
            Write-Host "fbclient.dll: $(Test-Path "$env:GITHUB_WORKSPACE\firebird5\fbclient.dll")"

      - name: Add Firebird to PATH
        shell: pwsh
        run: |
          echo "$env:FIREBIRD_DIR" >> $env:GITHUB_PATH
          echo "FIREBIRD_DIR=$env:FIREBIRD_DIR" >> $env:GITHUB_ENV
          Write-Host "FIREBIRD_DIR=$env:FIREBIRD_DIR"
          Write-Host "fbclient.dll exists: $(Test-Path "$env:FIREBIRD_DIR\fbclient.dll")"

      # Los tests corren contra el mismo subconjunto embedded que se empaqueta
      # (sin tools de servidor ni docs): si el prune rompiera algo, falla aquí.
      - name: Prune Firebird to embedded subset
        run: node scripts/prune-firebird.mjs firebird5

      # Toolchain fijado a propósito. `@stable` flota: cuando sale una versión
      # nueva de rustfmt, reformatea el backend sin que cambie una línea de
      # código y `cargo fmt --check` se pone rojo solo (pasó en ec0a595).
      # 1.100.0 es la versión con la que está formateado el backend
      # (rustfmt 1.11.0); subirla es un cambio deliberado que se acompaña de
      # `cargo fmt` en el mismo commit, nunca de un rojo inesperado.
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.100.0
          components: rustfmt, clippy

      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      # Descarga los crates exactos del lockfile para que fmt/clippy/test
      # corran sin red. Con cache caliente es un no-op; con cache frío o
      # parcial rellena huecos con retry.
      - name: Fetch cargo dependencies (locked, with retry)
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 15
          max_attempts: 3
          command: cargo fetch --locked --manifest-path src-tauri/Cargo.toml

      - name: Check format
        run: cargo fmt --all -- --check
        working-directory: ./src-tauri
      - name: Run clippy
        # `--all-targets` incluye los tests: sin esta bandera los errores de
        # las propias pruebas (lints de test, imports muertos en `mod tests`)
        # solo salen al compilarlas durante `cargo test`, no en el lint.
        run: cargo clippy --all-targets -- -D warnings
        working-directory: ./src-tauri
      - name: Run tests
        # Normal: ~2 min 16 s (CI #115; 135,83 s). Techo propio a nivel de paso
        # porque el cuelgue real ocurrió aquí: un test que se queda esperando la
        # conexión de Firebird no consume CPU, así que ningún mecanismo de GitHub
        # lo detecta; con 25 min deja de quemar runner mucho antes que el job.
        timeout-minutes: 25
        run: cargo test
        working-directory: ./src-tauri
      # Los bindings los genera specta a partir de las firmas Rust. Si el
      # generador emitiera tipos que la UI no acepta (pasó con `f64` ->
      # `number | null`, specta-rs/specta#569), el rojo aparece aquí y no al
      # regenerar en una máquina de desarrollo. El paso regenera el archivo,
      # pasa `tsc -b --force` y restaura el original: no ensucia el runner.
      - name: Setup Node.js for bindings check
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'
      - name: Install frontend dependencies for bindings check
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 10
          max_attempts: 3
          command: npm ci
      - name: Check generated bindings compile
        run: npm run check:bindings-compile

      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - name: Audit Rust dependencies (RustSec)
        working-directory: ./src-tauri
        run: |
          # RUSTSEC-2026-0187 (lopdf 0.36, vía pdf_signer) y RUSTSEC-2023-0071
          # (rsa 0.9, Marvin Attack) no tienen fix disponible y están
          # documentadas en CHANGELOG. Se ignoran explícitamente para que este
          # paso falle solo cuando aparezca una vulnerabilidad NUEVA.
          #
          # RUSTSEC-2026-0387: crypto-bigint 0.5.5 llega por
          # pdf_signer -> p256/p384 -> elliptic-curve 0.13, que exige
          # crypto-bigint 0.5 (el fix es 0.7.6). No hay forma de subirlo sin
          # que pdf_signer migre a elliptic-curve 0.14, así que se ignora
          # hasta entonces. Revisar al actualizar pdf_signer.
          # Un solo renglón: el paso corre en pwsh en windows-latest y ahí la
          # continuación de línea es un backtick, no una barra invertida.
          cargo audit --ignore RUSTSEC-2026-0187 --ignore RUSTSEC-2023-0071 --ignore RUSTSEC-2026-0387

  e2e:
    name: E2E Smoke (Playwright)
    runs-on: ubuntu-latest
    # Normal: ~4-6 min (CI #115: 3 min 50 s). Margen para la instalación de
    # navegadores y deps de apt (3 intentos de 15 min) y el arranque del dev
    # server de Vite.
    timeout-minutes: 40
    env:
      # Igual que en el job de frontend: los specs de fecha y los códigos
      # consecutivos (V-AAAA-NNNN) se derivan del día LOCAL del equipo. En UTC
      # no detectarían una regresión a fecha UTC; en la zona de la clínica sí.
      TZ: America/Bogota
    steps:
      - uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'
      - name: Install dependencies
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 10
          max_attempts: 3
          command: npm ci
      # Los specs se lintean también aquí (además de en el job Frontend): el
      # plugin de Playwright prohíbe page.waitForTimeout y test.only, que es
      # justo lo que rompería este job sin avisar.
      - name: Lint E2E specs
        run: npm run lint:e2e
      - name: Remove unused Google Chrome apt source
        # El mirror de Chrome (preinstalado en la imagen) publica índices
        # continuamente y provoca "Hash Sum mismatch" intermitente en
        # apt-get update; no lo usamos, así que lo quitamos.
        run: sudo rm -f /etc/apt/sources.list.d/google-chrome.list
      - name: Install Playwright browsers and OS deps
        # Reintento a nivel de bloque: si apt falla en un intento (índices
        # que cambian a mitad del fetch), el siguiente re-descarga índices
        # frescos y sigue. `playwright install` (navegador) no toca apt.
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 15
          max_attempts: 3
          retry_wait_seconds: 15
          command: |
            sudo apt-get update
            npx playwright install-deps chromium
            npx playwright install chromium
      # El mock IPC (e2e/ipc-mock.script.js) lanza un error ante un comando
      # sin handler; este paso verifica que todo comando invocable por la UI
      # tenga handler o esté en la allowlist explícita
      # (e2e/ipc-mock.allowlist.mjs). `npm test` lo corre también vía pretest.
      - name: Check E2E IPC mock covers all UI commands
        run: npm run check:e2e-mock
      - name: Check IPC command shapes
        run: npm run check:ipc-shapes
      - name: Run E2E smoke tests
        # La UI corre en el dev server de Vite con el IPC de Tauri mockeado
        # (e2e/ipc-mock.script.js): valida login, dashboard y el flujo
        # completo de una muestra sin necesitar el backend Rust.
        run: npm run test:e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  tauri-build:
    name: Tauri Build
    needs: [frontend, backend]
    runs-on: windows-latest
    # Normal: ~20-30 min (compilación release con LTO de todo el backend). Es
    # el job más caro: el techo está por encima del peor caso razonable para
    # no cortar un build sano, pero por debajo de la ventana de 6 h del runner.
    timeout-minutes: 60
    env:
      # createUpdaterArtifacts está activo: sin la clave de firma el build falla.
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'
      # Toolchain fijado a propósito. `@stable` flota: cuando sale una versión
      # nueva de rustfmt, reformatea el backend sin que cambie una línea de
      # código y `cargo fmt --check` se pone rojo solo (pasó en ec0a595).
      # 1.100.0 es la versión con la que está formateado el backend
      # (rustfmt 1.11.0); subirla es un cambio deliberado que se acompaña de
      # `cargo fmt` en el mismo commit, nunca de un rojo inesperado.
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.100.0
          components: rustfmt, clippy
      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - name: Fetch cargo dependencies (locked, with retry)
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 15
          max_attempts: 3
          command: cargo fetch --locked --manifest-path src-tauri/Cargo.toml
      - name: Install frontend dependencies
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 10
          max_attempts: 3
          command: npm ci
      - name: Download Firebird 5 Embedded (bundled runtime)
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 10
          max_attempts: 3
          shell: pwsh
          command: |
            # El motor embedded está gitignored; se descarga aquí para que el
            # instalador lo incluya vía "resources": ["binaries/firebird/**/*"].
            # El ZIP no tiene carpeta envolvente única: se localiza fbclient.dll
            # (raíz o subcarpeta) y se copia su árbol completo.
            $url = "https://github.com/FirebirdSQL/firebird/releases/download/v5.0.3/Firebird-5.0.3.1683-0-windows-x64.zip"
            $zip = "$env:TEMP\firebird5.zip"
            Invoke-WebRequest -Uri $url -OutFile $zip -UseBasicParsing
            Expand-Archive -Path $zip -DestinationPath "$env:GITHUB_WORKSPACE\firebird5_tmp" -Force
            $dll = Get-ChildItem "$env:GITHUB_WORKSPACE\firebird5_tmp" -Recurse -Filter fbclient.dll | Select-Object -First 1
            if (-not $dll) { throw "fbclient.dll no se encontró en el ZIP de Firebird" }
            $src = Split-Path $dll.FullName -Parent
            $dest = "$env:GITHUB_WORKSPACE\src-tauri\binaries\firebird"
            New-Item -ItemType Directory -Force -Path $dest | Out-Null
            Copy-Item "$src\*" -Destination $dest -Recurse -Force
            Remove-Item $zip -Force
            if (-not (Test-Path "$dest\fbclient.dll")) { throw "fbclient.dll no se copió al bundle" }
            Write-Host "fbclient.dll bundled: $(Test-Path "$dest\fbclient.dll")"
      - name: Prune Firebird to embedded subset
        run: node scripts/prune-firebird.mjs
      - name: Build Tauri app
        shell: pwsh
        run: |
          # En Pull Requests (como los de Dependabot o forks), los secrets de firma
          # del repo no están disponibles por seguridad de GitHub Actions. Si la clave
          # está ausente o vacía, se eliminan las variables vacías del entorno y se
          # desactiva temporalmente createUpdaterArtifacts en tauri.conf.json para que
          # el empaquetado NSIS se construya y valide sin requerir firma de release.
          if (-not $env:TAURI_SIGNING_PRIVATE_KEY -or $env:TAURI_SIGNING_PRIVATE_KEY.Trim() -eq "") {
            Write-Host "TAURI_SIGNING_PRIVATE_KEY no disponible; desactivando temporalmente firma de updater para CI..."
            Remove-Item Env:TAURI_SIGNING_PRIVATE_KEY -ErrorAction SilentlyContinue
            Remove-Item Env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD -ErrorAction SilentlyContinue
            $cfgPath = "src-tauri/tauri.conf.json"
            $cfg = Get-Content $cfgPath -Raw | ConvertFrom-Json
            $cfg.bundle.createUpdaterArtifacts = $false
            $cfg | ConvertTo-Json -Depth 10 | Set-Content $cfgPath -Encoding UTF8
          }
          npx tauri build
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: isalab-windows
          path: |
            src-tauri/target/release/bundle/**/*.exe
          retention-days: 30
