name: CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  frontend:
    name: Frontend (React)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Run ESLint
        run: npm run lint
      - name: Run Vitest
        run: npm run test
      - name: Build Frontend
        run: npm run build

  backend:
    name: Backend (Rust)
    runs-on: windows-latest
    env:
      FIREBIRD_VERSION: "5.0.3.1683-0"
      FIREBIRD_DIR: ${{ github.workspace }}\firebird5
    steps:
      - uses: actions/checkout@v7

      - name: Cache Firebird 5 runtime
        id: cache-firebird
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}\firebird5
          key: firebird-5.0.3.1683-windows-x64

      - name: Download Firebird 5 Embedded (if not cached)
        if: steps.cache-firebird.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $url = "https://github.com/FirebirdSQL/firebird/releases/download/v5.0.3/Firebird-5.0.3.1683-0-windows-x64.zip"
          $zip = "$env:TEMP\firebird5.zip"
          Write-Host "Downloading Firebird 5 from $url ..."
          Invoke-WebRequest -Uri $url -OutFile $zip -UseBasicParsing
          Expand-Archive -Path $zip -DestinationPath "$env:GITHUB_WORKSPACE\firebird5_tmp" -Force
          # El ZIP no tiene carpeta envolvente única: se localiza fbclient.dll
          # (raíz o subcarpeta) y se copia su árbol completo a FIREBIRD_DIR.
          $dll = Get-ChildItem "$env:GITHUB_WORKSPACE\firebird5_tmp" -Recurse -Filter fbclient.dll | Select-Object -First 1
          if (-not $dll) { throw "fbclient.dll no se encontró en el ZIP de Firebird" }
          $src = Split-Path $dll.FullName -Parent
          New-Item -ItemType Directory -Force -Path "$env:GITHUB_WORKSPACE\firebird5" | Out-Null
          Copy-Item "$src\*" -Destination "$env:GITHUB_WORKSPACE\firebird5" -Recurse -Force
          Remove-Item "$env:GITHUB_WORKSPACE\firebird5_tmp" -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item $zip -Force
          Write-Host "fbclient.dll: $(Test-Path "$env:GITHUB_WORKSPACE\firebird5\fbclient.dll")"

      - name: Add Firebird to PATH
        shell: pwsh
        run: |
          echo "$env:FIREBIRD_DIR" >> $env:GITHUB_PATH
          echo "FIREBIRD_DIR=$env:FIREBIRD_DIR" >> $env:GITHUB_ENV
          Write-Host "FIREBIRD_DIR=$env:FIREBIRD_DIR"
          Write-Host "fbclient.dll exists: $(Test-Path "$env:FIREBIRD_DIR\fbclient.dll")"

      # Los tests corren contra el mismo subconjunto embedded que se empaqueta
      # (sin tools de servidor ni docs): si el prune rompiera algo, falla aquí.
      - name: Prune Firebird to embedded subset
        run: node scripts/prune-firebird.mjs firebird5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Check format
        run: cargo fmt --all -- --check
        working-directory: ./src-tauri
      - name: Run clippy
        run: cargo clippy -- -D warnings
        working-directory: ./src-tauri
      - name: Run tests
        run: cargo test
        working-directory: ./src-tauri

  tauri-build:
    name: Tauri Build
    needs: [frontend, backend]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - name: Install frontend dependencies
        run: npm ci
      - name: Download Firebird 5 Embedded (bundled runtime)
        shell: pwsh
        run: |
          # El motor embedded está gitignored; se descarga aquí para que el
          # instalador lo incluya vía "resources": ["binaries/firebird/**/*"].
          # El ZIP no tiene carpeta envolvente única: se localiza fbclient.dll
          # (raíz o subcarpeta) y se copia su árbol completo.
          $url = "https://github.com/FirebirdSQL/firebird/releases/download/v5.0.3/Firebird-5.0.3.1683-0-windows-x64.zip"
          $zip = "$env:TEMP\firebird5.zip"
          Invoke-WebRequest -Uri $url -OutFile $zip -UseBasicParsing
          Expand-Archive -Path $zip -DestinationPath "$env:GITHUB_WORKSPACE\firebird5_tmp" -Force
          $dll = Get-ChildItem "$env:GITHUB_WORKSPACE\firebird5_tmp" -Recurse -Filter fbclient.dll | Select-Object -First 1
          if (-not $dll) { throw "fbclient.dll no se encontró en el ZIP de Firebird" }
          $src = Split-Path $dll.FullName -Parent
          $dest = "$env:GITHUB_WORKSPACE\src-tauri\binaries\firebird"
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          Copy-Item "$src\*" -Destination $dest -Recurse -Force
          Remove-Item $zip -Force
          if (-not (Test-Path "$dest\fbclient.dll")) { throw "fbclient.dll no se copió al bundle" }
          Write-Host "fbclient.dll bundled: $(Test-Path "$dest\fbclient.dll")"
      - name: Prune Firebird to embedded subset
        run: node scripts/prune-firebird.mjs
      - name: Build Tauri app
        run: npx tauri build
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: isalab-windows
          path: |
            src-tauri/target/release/bundle/**/*.msi
            src-tauri/target/release/bundle/**/*.exe
          retention-days: 30
